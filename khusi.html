<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A candlelit date for KHUSI</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            color: #fff0e5;
            font-family: Georgia, serif;
            background: radial-gradient(ellipse at 50% 40%, #71354b, #321a2b 60%, #130e1b)
        }

        main {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;
            isolation: isolate
        }

        .aura {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: #ffae66;
            filter: blur(100px);
            opacity: .24;
            animation: glow 3s ease-in-out infinite alternate;
            z-index: -1
        }

        article {
            width: min(680px, 100%);
            padding: clamp(28px, 7vw, 62px);
            text-align: center;
            border: 1px solid #ffdfc44d;
            border-radius: 28px;
            background: #281725c9;
            box-shadow: 0 25px 90px #08050b99;
            backdrop-filter: blur(8px);
            animation: appear 1.2s ease both
        }

        .small {
            font: 11px Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: .3em;
            color: #f5c2a3
        }

        h1 {
            margin: 18px 0;
            font-size: clamp(44px, 9vw, 76px);
            font-weight: 400;
            line-height: 1.05;
            color: #ffe4d1
        }

        h1 em {
            color: #f0a0ac
        }

        p {
            max-width: 480px;
            margin: 0 auto;
            color: #f5d9d2;
            font-size: 18px;
            line-height: 1.7
        }

        .ornament {
            margin: 24px;
            color: #ffd09b;
            letter-spacing: .6em
        }

        .scene {
            height: 135px;
            display: flex;
            align-items: end;
            justify-content: center;
            gap: clamp(15px, 4vw, 36px);
            margin: 28px 0 0
        }

        .rose {
            font-size: 50px;
            animation: sway 3s ease-in-out infinite
        }

        .rose:last-child {
            animation-delay: 1s
        }

        .bear {
            font-size: 68px;
            line-height: 1;
            animation: bob 2.8s ease-in-out infinite
        }

        .candle {
            height: 72px;
            width: 24px;
            border-radius: 5px 5px 3px 3px;
            background: linear-gradient(90deg, #d39471, #ffe5bc, #cf8969);
            position: relative;
            box-shadow: 0 0 25px #ffad5b66
        }

        .candle:before {
            content: "";
            position: absolute;
            width: 2px;
            height: 10px;
            background: #301b19;
            top: -8px;
            left: 11px
        }

        .flame {
            position: absolute;
            left: 4px;
            top: -34px;
            width: 16px;
            height: 28px;
            border-radius: 50% 50% 45% 45%;
            background: radial-gradient(ellipse at 50% 70%, #fff8c2 0 15%, #ffc75e 42%, #ff7545 75%, transparent 78%);
            filter: drop-shadow(0 0 9px #ffbb55);
            animation: flicker .16s infinite alternate
        }

        .base {
            height: 6px;
            width: min(410px, 85%);
            margin: 0 auto 28px;
            border-radius: 50%;
            background: linear-gradient(90deg, transparent, #d99b78, #ffe0b3, #d99b78, transparent);
            box-shadow: 0 7px 22px #ffbf8055
        }

        .invite {
            display: inline-block;
            padding: 13px 24px;
            border: 1px solid #f3b99999;
            border-radius: 30px;
            font: 11px Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: .16em;
            color: #ffe8d9
        }

        .signoff {
            margin-top: 20px;
            font-size: 15px
        }

        .heart {
            color: #f6a0aa;
            display: inline-block;
            animation: beat 1.3s infinite
        }

        .sparkle {
            position: fixed;
            top: -20px;
            z-index: 3;
            color: #ffe8ae;
            text-shadow: 0 0 10px #ffd279;
            pointer-events: none;
            animation: fall linear forwards
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes glow {
            to {
                transform: scale(1.2);
                opacity: .35
            }
        }

        @keyframes flicker {
            to {
                transform: rotate(5deg) scale(.9, 1.08)
            }
        }

        @keyframes sway {
            50% {
                transform: rotate(9deg) translateY(-5px)
            }
        }

        @keyframes bob {
            50% {
                transform: translateY(-8px) rotate(2deg)
            }
        }

        @keyframes beat {
            50% {
                transform: scale(1.25)
            }
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *:before,
            *:after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="aura" aria-hidden="true"></div>
        <article>
            <div class="small">An evening made just for you</div>
            <h1>KHUSI,<br><em>my lovely rose</em></h1>
            <p>Under a sky of tiny lights, surrounded by roses and candlelight, I’d love to share a sweet little dinner
                date with you.</p>
            <div class="ornament" aria-hidden="true">✧ ❀ ✧</div>
            <div class="scene" aria-hidden="true"><span class="rose">🌹</span>
                <div class="candle"><i class="flame"></i></div><span class="bear">🧸</span>
                <div class="candle"><i class="flame"></i></div><span class="rose">🌹</span>
            </div>
            <div class="base" aria-hidden="true"></div>
            <div class="invite">Dinner, roses &amp; a little magic</div>
            <p class="signoff">With all my affection <span class="heart">♥</span></p>
        </article>
    </main>
    <script>
        const marks = ['✦', '✧', '·', '♥'];
        function sparkle() { const s = document.createElement('span'); s.className = 'sparkle'; s.textContent = marks[Math.random() * marks.length | 0]; s.style.left = Math.random() * 100 + 'vw'; s.style.fontSize = 8 + Math.random() * 12 + 'px'; s.style.animationDuration = 5 + Math.random() * 7 + 's'; document.body.appendChild(s); setTimeout(() => s.remove(), 12500) }
        for (let i = 0; i < 18; i++)setTimeout(sparkle, i * 180); setInterval(sparkle, 500);
    </script>
</body>

</html>
